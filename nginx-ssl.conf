# /etc/nginx/sites-available/chinawheely
# Chinawheely Nginx HTTPS configuration with Let's Encrypt

# HTTP: redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chinawheely.com www.chinawheely.com;

    location /.well-known/acme-challenge/ {
        # Allow Certbot to validate domain
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.chinawheely.com;

    ssl_certificate /etc/letsencrypt/live/chinawheely.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinawheely.com/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root /var/www/chinawheely;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hide server version
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://open.er-api.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
}

# Redirect apex domain to www over HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chinawheely.com;

    ssl_certificate /etc/letsencrypt/live/chinawheely.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinawheely.com/privkey.pem;

    return 301 https://www.chinawheely.com$request_uri;
}
