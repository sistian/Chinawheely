<style>
  :root{
    --green:#1B4D3E; --green-2:#2E6B57; --light:#F4F7F5; --line:#E2E8E5;
    --text:#1F2A26; --muted:#6B7C75; --danger:#B3261E; --warn:#B26A00;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--light);color:var(--text);}
  header{background:var(--green);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px;}
  header .who{font-size:13px;opacity:.85;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 20px;border-radius:8px;font-size:14px;font-weight:600;}
  .tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;}
  .tab-btn .cnt{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:#EFF4F1;font-size:11px;color:var(--green);margin-left:6px;}
  .tab-btn.active .cnt{background:rgba(255,255,255,.25);color:#fff;}
  .o-pay-unpaid{background:#FBE9E7;color:var(--danger);} .o-pay-submitted{background:#FFF4E0;color:var(--warn);}
  .o-pay-paid{background:#E4F4EC;color:var(--green);} .o-pay-refunded,.o-pay-failed{background:#F1F3F2;color:var(--muted);}
  .t-in_service{background:#E7F0FA;color:#1B4D8F;} .t-no_show{background:#FBE9E7;color:var(--danger);}
  .wrap{max-width:1280px;margin:0 auto;padding:18px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .stat .n{font-size:26px;font-weight:700;color:var(--green);}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat.alert .n{color:var(--danger);}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  input,select,textarea,button{font:inherit;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button{cursor:pointer;border:1px solid var(--green);background:var(--green);color:#fff;padding:8px 16px;border-radius:6px;font-size:14px;}
  button:hover{background:var(--green-2);}
  button.ghost{background:#fff;color:var(--green);}
  button.ghost:hover{background:#EFF4F1;}
  button.danger{background:#fff;color:var(--danger);border-color:#E7C6C3;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:12px;color:var(--muted);font-weight:600;background:#FAFCFB;position:sticky;top:0;}
  tbody tr:hover{background:#F7FAF8;cursor:pointer;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .t-new{background:#E7F0FA;color:#1B4D8F;} .t-contacted{background:#FFF4E0;color:var(--warn);}
  .t-confirmed{background:#E4F4EC;color:var(--green);} .t-completed{background:#EDEFEE;color:var(--muted);}
  .t-lost{background:#FBE9E7;color:var(--danger);} .t-cold{background:#F1F3F2;color:var(--muted);}
  .mail-sent{color:var(--green);font-weight:600;} .mail-failed{color:var(--danger);font-weight:600;} .mail-pending{color:var(--muted);}
  .login{max-width:380px;margin:9vh auto;}
  .login h2{margin:0 0 4px;font-size:19px;}
  .login p.sub{margin:0 0 18px;color:var(--muted);font-size:13px;}
  .fld{margin-bottom:12px;}
  .err{color:var(--danger);font-size:13px;min-height:18px;}
  .hidden{display:none !important;}
  .drawer{position:fixed;top:0;right:0;width:min(520px,100%);height:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);padding:18px;overflow:auto;z-index:50;}
  .drawer h3{margin:0 0 12px;font-size:16px;}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px;margin-bottom:14px;}
  .kv dt{color:var(--muted);} .kv dd{margin:0;word-break:break-word;}
  .mask{position:fixed;inset:0;background:rgba(20,30,26,.35);z-index:40;}
  .note{white-space:pre-wrap;}
  .empty{padding:28px;text-align:center;color:var(--muted);font-size:14px;}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;}
</style>

<body>

<!-- 主体 -->
<div id="appView" class="hidden">

    <div class="row">
      <span class="who" id="whoami"></span>

    <div class="stats" id="stats"></div>

    <div class="card">
      <div class="filters">

        <div><label>关键词</label><input id="fQ" type="search" placeholder="姓名 / 邮箱 / 电话 / 参考号 / 城市"/></div>

    <div class="card">
      <div class="filters">
        <div><label>服务状态</label><select id="oFStatus"><option value="all">全部</option><option value="pending">pending 待确认</option><option value="confirmed">confirmed 已确认</option><option value="in_service">in_service 用车中</option><option value="completed">completed 已完成</option><option value="cancelled">cancelled 已取消</option><option value="no_show">no_show 未出现</option></select></div>

      <span class="row"><button class="ghost" id="oBtnPrev">上一页</button><button class="ghost" id="oBtnNext">下一页</button></span>

<div class="drawer hidden" id="drawer">

<!-- 修改密码 -->
<div class="mask hidden" id="pwdMask"></div>
<div class="drawer hidden" id="pwdPanel" style="width:min(380px,100%)">
  <h3>修改密码</h3>
  <div class="fld"><label>当前密码</label><input id="pwdCur" type="password"/></div>
  <div class="fld"><label>新密码（至少 8 位）</label><input id="pwdNew" type="password"/></div>

<script>
(function(){
  'use strict';
  var API = 'https://api.chinawheely.com/api';
  var TOKEN_KEY = 'cw_admin_token';
  var LIMIT = 50;
  var offset = 0, total = 0, current = null, token = null;

  // 订单视图状态
  var oOffset = 0, oCurrent = null, activeTab = 'leads';
  var PRODUCT_LABEL = { airport: '接送机', charter: '包车', intercity: '城际' };
  var PAY_LABEL = { unpaid: '未支付', payment_submitted: '待核销', paid: '已支付', refunded: '已退款', failed: '失败' };
  var ST_LABEL = { pending: '待确认', confirmed: '已确认', in_service: '用车中', completed: '已完成', cancelled: '已取消', no_show: '未出现' };

  function $(id){ return document.getElementById(id); }
  function show(el, on){ el.classList.toggle('hidden', !on); }

  function api(path, opts){
    opts = opts || {};
    var headers = opts.headers || {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch(API + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(res){
      var ct = res.headers.get('content-type') || '';
      if (ct.indexOf('application/json') >= 0) {
        return res.json().then(function(j){ return { ok: res.ok, status: res.status, data: j }; });
      }
      return res.text().then(function(t){ return { ok: res.ok, status: res.status, data: t }; });
    });
  }

  function fmtTime(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    var p = function(n){ return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ---------- Tab 切换 ---------- */
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    $('viewLeads').classList.toggle('hidden', tab !== 'leads');
    $('viewOrders').classList.toggle('hidden', tab !== 'orders');
    if (tab === 'orders') loadOrders();
    else load();
  }

  /* ---------- 订单列表 ---------- */
  function oQuery() {
    var p = [];
    var st = $('oFStatus').value, py = $('oFPay').value, q = $('oFQ').value.trim();
    var fr = $('oFFrom').value, to = $('oFTo').value;
    if (st && st !== 'all') p.push('status=' + encodeURIComponent(st));
    if (py && py !== 'all') p.push('payment=' + encodeURIComponent(py));
    if (q) p.push('q=' + encodeURIComponent(q));
    if (fr) p.push('from=' + encodeURIComponent(fr));
    if (to) p.push('to=' + encodeURIComponent(to) + 'T23:59:59');
    p.push('limit=' + LIMIT);
    p.push('offset=' + oOffset);
    return p.join('&');
  }

  function loadOrders() {
    api('/admin/orders?' + oQuery()).then(function(r) {
      if (r.status === 401) { logout(true); return; }
      if (!r.ok) { alert('加载失败：' + ((r.data && r.data.error) || r.status)); return; }
      renderOStats(r.data.stats || {});
      renderORows(r.data.rows || []);
    }).catch(function(){ alert('网络错误'); });
  }

  function renderOStats(s) {
    var cards = [
      ['全部订单', s.total || 0, false],
      ['今日新增', s.today || 0, false],
      ['待确认', (s.byStatus && s.byStatus.pending) || 0, ((s.byStatus && s.byStatus.pending) || 0) > 0],
      ['待核销支付', (s.byPayment && s.byPayment.payment_submitted) || 0, ((s.byPayment && s.byPayment.payment_submitted) || 0) > 0],
      ['未收金 ¥', s.pendingValueCny || 0, false],
      ['已收金 ¥', s.paidValueCny || 0, false]
    ];
    $('oStats').innerHTML = cards.map(function(c) {
      return '<div class="stat' + (c[2] ? ' alert' : '') + '"><div class="n">' + c[1] + '</div><div class="l">' + c[0] + '</div></div>';
    }).join('');
    $('cntOrders').textContent = s.total || 0;
  }

  function renderORows(rows) {
    var tb = $('oRows');
    show($('oEmpty'), rows.length === 0);
    tb.innerHTML = rows.map(function(r) {
      var pay = r.payment_status || 'unpaid';
      var payCls = pay === 'payment_submitted' ? 'o-pay-submitted' : 'o-pay-' + pay;
      var contact = (r.customer_name || '-') + '<br><span style="color:var(--muted);font-size:11px">' + esc(r.email || '') + (r.phone ? ' / ' + esc(r.phone) : '') + '</span>';
      var amount = r.total_cny != null ? '¥' + r.total_cny : '-';
      return '<tr data-oref="' + esc(r.ref) + '">' +
        '<td>' + esc(fmtTime(r.created_at)) + '</td>' +
        '<td style="font-weight:600">' + esc(r.ref) + '</td>' +
        '<td>' + contact + '</td>' +
        '<td>' + esc(r.city || '-') + '</td>' +
        '<td>' + esc(PRODUCT_LABEL[r.product] || r.product || '-') + '</td>' +
        '<td>' + esc(r.vehicle || '-') + (r.tier ? '<br><span style="color:var(--muted);font-size:11px">' + esc(r.tier) + '</span>' : '') + '</td>' +
        '<td>' + esc(r.pickup_date || '-') + (r.pickup_time ? ' ' + esc(r.pickup_time) : '') + '</td>' +
        '<td style="font-weight:600;color:var(--danger)">' + esc(amount) + '</td>' +
        '<td><span class="tag ' + payCls + '">' + esc(PAY_LABEL[pay] || pay) + '</span></td>' +
        '<td><span class="tag t-' + esc(r.status) + '">' + esc(ST_LABEL[r.status] || r.status) + '</span></td>' +
      '</tr>';
    }).join('');
    $('oCountInfo').textContent = '当前 ' + rows.length + ' 条 · 偏移 ' + oOffset;
  }

  /* ---------- 订单详情 ---------- */
  var oCache = [];
  function openODetail(ref) {
    api('/admin/orders?limit=200').then(function(r) {
      if (!r.ok) return;
      oCache = r.data.rows || [];
      var row = null;
      oCache.forEach(function(x){ if (x.ref === ref) row = x; });
      if (!row) return;
      oCurrent = row;
      var items = [
        ['订单号', row.ref],
        ['下单时间', fmtTime(row.created_at)],
        ['客户', row.customer_name],
        ['邮箱', row.email],
        ['电话', row.phone],
        ['城市', row.city],
        ['服务', PRODUCT_LABEL[row.product] || row.product],
        ['车型', row.vehicle],
        ['时长档', row.tier],
        ['金额', row.total_cny != null ? '¥' + row.total_cny + (row.total_usd != null ? ' (≈$' + row.total_usd + ')' : '') : '-'],
        ['支付方式', row.payment_method || '-'],
        ['人数', row.pax],
        ['出发', (row.pickup_date || '-') + (row.pickup_time ? ' ' + row.pickup_time : '')],
        ['备注', row.admin_note || '']
      ];
      $('oDKv').innerHTML = items.map(function(it) {
        return '<dt>' + esc(it[0]) + '</dt><dd>' + esc(it[1] == null ? '' : it[1]) + '</dd>';
      }).join('');
      $('oDStatus').value = row.status || 'pending';
      $('oDPay').value = row.payment_status || 'unpaid';
      $('oDNote').value = row.admin_note || '';
      $('oDDate').value = row.pickup_date || '';
      $('oDTime').value = row.pickup_time || '';
      $('oDMsg').textContent = '';
      show($('oMask'), true); show($('oDrawer'), true);
    });
  }

  function saveODetail() {
    if (!oCurrent) return;
    $('oDMsg').textContent = '';
    var body = {
      ref: oCurrent.ref,
      status: $('oDStatus').value,
      payment_status: $('oDPay').value,
      admin_note: $('oDNote').value
    };
    if ($('oDDate').value && $('oDDate').value !== oCurrent.pickup_date) body.pickup_date = $('oDDate').value;
    if ($('oDTime').value && $('oDTime').value !== oCurrent.pickup_time) body.pickup_time = $('oDTime').value;
    api('/admin/orders', { method:'PATCH', body: body }).then(function(r) {
      if (!r.ok) { $('oDMsg').textContent = (r.data && r.data.error) || '保存失败'; return; }
      $('oDMsg').textContent = '已保存';
      loadOrders();
    });
  }

  function exportOrdersCsv() {
    api('/admin/orders?limit=200' + (oQuery() ? '&' + oQuery() : '')).then(function(r) {
      if (!r.ok) return;
      var rows = r.data.rows || [];
      var head = ['ref','created_at','status','payment_status','payment_method','customer_name','email','phone','city','product','vehicle','tier','total_cny','total_usd','pickup_date','pickup_time','pax','admin_note'];
      var csv = [head.join(',')];
      rows.forEach(function(row) {
        csv.push(head.map(function(h) {
          var v = row[h] == null ? '' : String(row[h]);
          return '"' + v.replace(/"/g,'""') + '"';
        }).join(','));
      });
      var blob = new Blob(['\ufeff' + csv.join('\n')], { type:'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chinawheely-orders-' + new Date().toISOString().slice(0,10) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  }

  /* ---------- 登录 ---------- */
  function doLogin(){
    var email = $('loginEmail').value.trim();
    var pw = $('loginPw').value;
    $('loginErr').textContent = '';
    if (!email || !pw) { $('loginErr').textContent = '请输入邮箱和密码'; return; }
    $('loginBtn').disabled = true;
    api('/admin/session', { method:'POST', body:{ email: email, password: pw } })
      .then(function(r){
        $('loginBtn').disabled = false;
        if (!r.ok) { $('loginErr').textContent = (r.data && r.data.error) || '登录失败'; return; }
        token = r.data.token;
        try {
          sessionStorage.setItem(TOKEN_KEY, token);
          sessionStorage.setItem('cw_admin_email', r.data.email || '');
        } catch(e){}
        $('whoami').textContent = r.data.email;
        show($('loginView'), false); show($('appView'), true);
        load();
      })
      .catch(function(){ $('loginBtn').disabled = false; $('loginErr').textContent = '网络错误，请重试'; });
  }

  /* ---------- 列表 ---------- */
  function query(){
    var p = [];
    var st = $('fStatus').value, so = $('fSource').value, q = $('fQ').value.trim();
    var fr = $('fFrom').value, to = $('fTo').value;
    if (st && st !== 'all') p.push('status=' + encodeURIComponent(st));
    if (so && so !== 'all') p.push('source=' + encodeURIComponent(so));
    if (q) p.push('q=' + encodeURIComponent(q));
    if (fr) p.push('from=' + encodeURIComponent(fr));
    if (to) p.push('to=' + encodeURIComponent(to) + 'T23:59:59');
    p.push('limit=' + LIMIT);
    p.push('offset=' + offset);
    return p.join('&');
  }

  function load(){
    api('/admin/leads?' + query()).then(function(r){
      if (r.status === 401) { logout(true); return; }
      if (!r.ok) { alert('加载失败：' + ((r.data && r.data.error) || r.status)); return; }
      renderStats(r.data.stats || {});
      renderRows(r.data.rows || []);
    }).catch(function(){ alert('网络错误'); });
  }

  function renderStats(s){
    var cards = [
      ['全部线索', s.total || 0, false],
      ['今日新增', s.today || 0, false],
      ['待跟进(new)', (s.byStatus && s.byStatus.new) || 0, false],
      ['已联系', (s.byStatus && s.byStatus.contacted) || 0, false],
      ['已确认', (s.byStatus && s.byStatus.confirmed) || 0, false],
      ['邮件失败', s.failedMail || 0, (s.failedMail || 0) > 0]
    ];
    $('stats').innerHTML = cards.map(function(c){
      return '<div class="stat' + (c[2] ? ' alert' : '') + '"><div class="n">' + c[1] + '</div><div class="l">' + c[0] + '</div></div>';
    }).join('');
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function renderRows(rows){
    var tb = $('rows');
    total = rows.length;
    show($('empty'), rows.length === 0);
    tb.innerHTML = rows.map(function(r){
      var contact = (r.email || '') + (r.phone ? ' / ' + r.phone : '');
      var summary = r.subject || r.message || '';
      return '<tr data-ref="' + esc(r.ref) + '">' +
        '<td>' + esc(fmtTime(r.created_at)) + '</td>' +
        '<td>' + esc(r.ref) + '</td>' +
        '<td>' + esc(r.source) + '</td>' +
        '<td>' + esc(r.name || '-') + '</td>' +
        '<td>' + esc(r.city || '-') + '</td>' +
        '<td>' + esc(contact) + '</td>' +
        '<td>' + esc(String(summary).slice(0, 60)) + '</td>' +
        '<td class="mail-' + esc(r.mail_status) + '">' + esc(r.mail_status) + '</td>' +
        '<td><span class="tag t-' + esc(r.status) + '">' + esc(r.status) + '</span></td>' +
      '</tr>';
    }).join('');
    $('countInfo').textContent = '当前 ' + rows.length + ' 条 · 偏移 ' + offset;
  }

  /* ---------- 详情 ---------- */
  function openDetail(ref){
    api('/admin/leads?limit=200').then(function(r){
      if (!r.ok) return;
      var row = null;
      (r.data.rows || []).forEach(function(x){ if (x.ref === ref) row = x; });
      if (!row) return;
      current = row;
      var p = row.payload || {};
      var items = [];
      items.push(['参考号', row.ref]);
      items.push(['时间', fmtTime(row.created_at)]);
      items.push(['来源', row.source]);
      items.push(['姓名', row.name]);
      items.push(['邮箱', row.email]);
      items.push(['电话', row.phone]);
      items.push(['城市', row.city]);
      items.push(['语言', row.lang]);
      items.push(['邮件状态', row.mail_status + (row.mail_error ? '（' + row.mail_error + '）' : '')]);
      Object.keys(p).forEach(function(k){
        if (k === '__sig') return;
        var v = p[k];
        items.push([k, Array.isArray(v) ? v.join(', ') : v]);
      });
      $('dKv').innerHTML = items.map(function(it){
        return '<dt>' + esc(it[0]) + '</dt><dd>' + esc(it[1] == null ? '' : it[1]) + '</dd>';
      }).join('');
      $('dStatus').value = row.status || 'new';
      $('dScore').value = row.score || '';
      $('dNote').value = row.admin_note || '';
      $('dMsg').textContent = '';
      show($('mask'), true); show($('drawer'), true);
    });
  }

  function saveDetail(){
    if (!current) return;
    $('dMsg').textContent = '';
    api('/admin/leads', { method:'PATCH', body:{ ref: current.ref, status: $('dStatus').value, score: $('dScore').value, admin_note: $('dNote').value } })
      .then(function(r){
        if (!r.ok) { $('dMsg').textContent = (r.data && r.data.error) || '保存失败'; return; }
        $('dMsg').textContent = '已保存';
        load();
      });
  }

  /* ---------- 导出 ---------- */
  function exportCsv(){
    api('/admin/leads?limit=200' + (query() ? '&' + query() : '')).then(function(r){
      if (!r.ok) return;
      var rows = r.data.rows || [];
      var head = ['ref','created_at','source','status','score','name','email','phone','city','subject','message','mail_status','admin_note'];
      var csv = [head.join(',')];
      rows.forEach(function(row){
        csv.push(head.map(function(h){
          var v = row[h] == null ? '' : String(row[h]);
          return '"' + v.replace(/"/g,'""') + '"';
        }).join(','));
      });
      var blob = new Blob(['\ufeff' + csv.join('\n')], { type:'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chinawheely-leads-' + new Date().toISOString().slice(0,10) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  }

  /* ---------- 密码 ---------- */
  function savePassword(){
    $('pwdMsg').textContent = '';
    api('/admin/password', { method:'PATCH', body:{ currentPassword: $('pwdCur').value, newPassword: $('pwdNew').value } })
      .then(function(r){
        if (!r.ok) { $('pwdMsg').textContent = (r.data && r.data.error) || '修改失败'; return; }
        $('pwdMsg').textContent = '密码已更新';
        $('pwdCur').value = ''; $('pwdNew').value = '';
      });
  }

  function logout(silent){
    token = null;
    try { sessionStorage.removeItem(TOKEN_KEY); } catch(e){}
    show($('appView'), false); show($('loginView'), true);
    show($('drawer'), false); show($('mask'), false);
    if (!silent) $('loginErr').textContent = '';
  }

  /* ---------- 绑定 ---------- */
  document.addEventListener('DOMContentLoaded', function(){
    $('loginBtn').addEventListener('click', doLogin);
    $('loginPw').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
    $('btnSearch').addEventListener('click', function(){ offset = 0; load(); });
    $('btnReset').addEventListener('click', function(){
      $('fStatus').value = 'all'; $('fSource').value = 'all'; $('fFrom').value = '';
      $('fTo').value = ''; $('fQ').value = ''; offset = 0; load();
    });
    $('btnExport').addEventListener('click', exportCsv);
    $('btnPrev').addEventListener('click', function(){ offset = Math.max(0, offset - LIMIT); load(); });
    $('btnNext').addEventListener('click', function(){ offset += LIMIT; load(); });
    $('btnLogout').addEventListener('click', function(){ logout(false); });
    $('btnPwd').addEventListener('click', function(){ $('pwdMsg').textContent=''; show($('pwdMask'), true); show($('pwdPanel'), true); });
    $('pwdClose').addEventListener('click', function(){ show($('pwdPanel'), false); show($('pwdMask'), false); });
    $('pwdSave').addEventListener('click', savePassword);
    $('dClose').addEventListener('click', function(){ show($('drawer'), false); show($('mask'), false); });
    $('mask').addEventListener('click', function(){ show($('drawer'), false); show($('mask'), false); });
    $('dSave').addEventListener('click', saveDetail);
    $('dWhatsapp').addEventListener('click', function(){
      if (!current) return;
      var text = 'Hi ' + (current.name || '') + ' (' + current.ref + ')';
      window.open('https://wa.me/8615527771775?text=' + encodeURIComponent(text), '_blank');
    });
    $('dMail').addEventListener('click', function(){
      if (!current) return;
      window.location.href = 'mailto:' + encodeURIComponent(current.email || '') +
        '?subject=' + encodeURIComponent('Chinawheely inquiry ' + current.ref);
    });
    $('dCopy').addEventListener('click', function(){
      if (!current) return;
      var txt = [current.ref, current.name, current.email, current.phone, current.city, current.subject, current.message].join('\n');
      if (navigator.clipboard) { navigator.clipboard.writeText(txt); $('dMsg').textContent = '已复制'; }
      else { $('dMsg').textContent = '请手动复制'; }
    });
    $('rows').addEventListener('click', function(e){
      var tr = e.target.closest ? e.target.closest('tr') : null;
      if (tr && tr.getAttribute('data-ref')) openDetail(tr.getAttribute('data-ref'));
    });

    // 订单视图绑定
    $('tabLeads').addEventListener('click', function(){ switchTab('leads'); });
    $('tabOrders').addEventListener('click', function(){ switchTab('orders'); });
    $('oBtnSearch').addEventListener('click', function(){ oOffset = 0; loadOrders(); });
    $('oBtnReset').addEventListener('click', function(){
      $('oFStatus').value='all'; $('oFPay').value='all'; $('oFFrom').value='';
      $('oFTo').value=''; $('oFQ').value=''; oOffset = 0; loadOrders();
    });
    $('oBtnExport').addEventListener('click', exportOrdersCsv);
    $('oBtnPrev').addEventListener('click', function(){ oOffset = Math.max(0, oOffset - LIMIT); loadOrders(); });
    $('oBtnNext').addEventListener('click', function(){ oOffset += LIMIT; loadOrders(); });
    $('oDClose').addEventListener('click', function(){ show($('oDrawer'), false); show($('oMask'), false); });
    $('oMask').addEventListener('click', function(){ show($('oDrawer'), false); show($('oMask'), false); });
    $('oDSave').addEventListener('click', saveODetail);
    $('oDWhatsapp').addEventListener('click', function(){
      if (!oCurrent) return;
      var text = 'Hi ' + (oCurrent.customer_name || '') + ' (' + oCurrent.ref + ')';
      window.open('https://wa.me/' + String(oCurrent.phone || '8615527771775').replace(/\D/g,'') + '?text=' + encodeURIComponent(text), '_blank');
    });
    $('oDMail').addEventListener('click', function(){
      if (!oCurrent) return;
      window.location.href = 'mailto:' + encodeURIComponent(oCurrent.email || '') +
        '?subject=' + encodeURIComponent('Chinawheely order ' + oCurrent.ref);
    });
    $('oDCopy').addEventListener('click', function(){
      if (!oCurrent) return;
      var txt = [oCurrent.ref, oCurrent.customer_name, oCurrent.email, oCurrent.phone, oCurrent.city, oCurrent.pickup_date, oCurrent.pickup_time, oCurrent.total_cny].join('\n');
      if (navigator.clipboard) { navigator.clipboard.writeText(txt); $('oDMsg').textContent = '已复制'; }
    });
    $('oRows').addEventListener('click', function(e){
      var tr = e.target.closest ? e.target.closest('tr') : null;
      if (tr && tr.getAttribute('data-oref')) openODetail(tr.getAttribute('data-oref'));
    });

    try {
      token = sessionStorage.getItem(TOKEN_KEY);
      $('whoami').textContent = sessionStorage.getItem('cw_admin_email') || '';
    } catch(e){ token = null; }
    if (token) {
      show($('loginView'), false); show($('appView'), true);
      api('/admin/leads?limit=1').then(function(r){
        if (r.status === 401) { logout(true); return; }
        load();
        // 预取订单计数
        api('/admin/orders?limit=1').then(function(r2){
          if (r2.ok && r2.data.stats) $('cntOrders').textContent = r2.data.stats.total || 0;
        });
      });
    }
  });
})();
</script>
</body>
</html>
